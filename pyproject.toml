[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "desktop-bot"
version = "0.1.0"
description = "AI-powered desktop assistant perception pipeline"
requires-python = ">=3.11"
dependencies = [
    "mss>=9.0.1",
    "Pillow>=10.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pyautogui>=0.9.54",
    "pygetwindow>=0.0.9; sys_platform == 'win32'",
    "chromadb>=0.5.0",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
browser = ["playwright>=1.45.0"]

[project.scripts]
desktop-bot = "desktop_bot.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["desktop_bot*"]
